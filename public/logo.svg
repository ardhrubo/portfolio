<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="logoCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="logoAmbientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Dark Squircle Canvas -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="24" fill="#0d1117" stroke="#10b981" stroke-opacity="0.3" stroke-width="2.5" filter="url(#logoAmbientGlow)" />

  <!-- Monogram D Letterform -->
  <line x1="32" y1="25" x2="32" y2="75" stroke="url(#logoEmeraldGrad)" stroke-width="9" stroke-linecap="round" />
  <path d="M 32 26.5 H 51.5 C 66.5 26.5 76.5 36.5 76.5 50 C 76.5 63.5 66.5 73.5 51.5 73.5 H 32" fill="none" stroke="url(#logoEmeraldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Chevron '>' -->
  <path d="M 43 43 L 51 50 L 43 57" fill="none" stroke="url(#logoCyanGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Quantum Pulse Node -->
  <circle cx="59" cy="57" r="3.2" fill="#10b981" />
</svg>
