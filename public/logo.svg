<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Core D Monogram Gradient -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Terminal Prompt Gradient -->
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Radial Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  <rect width="100" height="100" rx="26" fill="url(#centerGlow)" />
  <rect x="1.25" y="1.25" width="97.5" height="97.5" rx="24.75" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Quantum Orbital Ring (Computational Chemistry / Modeling) -->
  <ellipse cx="53" cy="50" rx="26" ry="11" fill="none" stroke="#06b6d4" stroke-opacity="0.38" stroke-width="1.8" stroke-dasharray="4 3" transform="rotate(-28 53 50)" />
  <circle cx="73" cy="38" r="2.2" fill="#38bdf8" filter="url(#softGlow)" />

  <!-- Monogram D Letterform -->
  <!-- Left Vertical Spine -->
  <path d="M 31 23 L 31 77" stroke="url(#dGrad)" stroke-width="9.5" stroke-linecap="round" filter="url(#softGlow)" />
  
  <!-- Outer Sweeping D Curve -->
  <path d="M 31 24.5 L 53 24.5 C 68.5 24.5 78.5 35 78.5 50 C 78.5 65 68.5 75.5 53 75.5 L 31 75.5" fill="none" stroke="url(#dGrad)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Terminal Code Prompt '> _' inside the D loop (Full-Stack & Automation) -->
  <!-- Chevron '>' -->
  <path d="M 43 43 L 50.5 50 L 43 57" fill="none" stroke="url(#promptGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cursor Underscore '_' -->
  <line x1="55" y1="57" x2="63" y2="57" stroke="#38bdf8" stroke-width="3.8" stroke-linecap="round" />
</svg>
